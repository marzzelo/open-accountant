<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Open Accountant</title>

  <!-- Inter (Google Fonts) — tipografía moderna, legible, excelentes números tabulares -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">

  <!-- Tailwind Play CDN (JIT in the browser, no build step) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Paleta recentrada en azul ≈ rgb(0,161,255) manteniendo los mismos nombres (dark-*)
    // para conservar compatibilidad con las clases usadas en los templates JS.
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dark: {
              950: '#070C17',
              900: '#0B1220',
              800: '#111A2B',
              700: '#172338',
              600: '#1E2D47',
              500: '#2C406A',
              400: '#8295B0',
              300: '#B7C4D8',
              100: '#EAF2FB',
            },
            blue: {
              400: '#4FC3FF',
              500: '#1FB0FF',
              600: '#00A1FF',
              700: '#0086D6',
            },
            activo:     '#4FC3FF',
            pasivo:     '#FF6B6B',
            ingreso:    '#3DDC97',
            gasto:      '#FFB547',
            patrimonio: '#B69CFF',
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <!-- Favicon: símbolo moneda azul -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%2300A1FF'/><text x='50' y='70' text-anchor='middle' font-size='58' font-family='Inter,sans-serif' font-weight='800' fill='white'>$</text></svg>">
  <link rel="stylesheet" href="/css/style.css?v=2.0.1.20260412.2">
  <link rel="stylesheet" href="/css/theme-modern.css?v=2.0.1.20260423.1">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>

  <!-- Icon sprite: iconos modernos de toolbar (stroke, 1.75px, 24x24) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- Brand logo -->
      <symbol id="i-brand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M15 8.5c-.8-.8-2-1.2-3-1.2-1.8 0-3 1-3 2.3 0 1.3 1 1.8 3 2.4 2 .6 3 1.1 3 2.4 0 1.3-1.2 2.3-3 2.3-1 0-2.2-.4-3-1.2"/>
        <path d="M12 5.6V7M12 17v1.4"/>
      </symbol>
      <!-- Board / grid -->
      <symbol id="i-board" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/>
        <rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/>
        <rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/>
        <rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>
      </symbol>
      <!-- Balance (scales) -->
      <symbol id="i-balance" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4v16"/>
        <path d="M6 20h12"/>
        <path d="M5 7h14"/>
        <path d="M5 7l-2.5 5.5a3.5 3.5 0 007 0L7 7"/>
        <path d="M19 7l-2.5 5.5a3.5 3.5 0 007 0L21 7"/>
      </symbol>
      <!-- Journal (book-open) -->
      <symbol id="i-journal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 5.5a1.5 1.5 0 011.5-1.5H10a2 2 0 012 2v14a2 2 0 00-2-2H3z"/>
        <path d="M21 5.5a1.5 1.5 0 00-1.5-1.5H14a2 2 0 00-2 2v14a2 2 0 012-2h7z"/>
      </symbol>
      <!-- Ledger (book) -->
      <symbol id="i-ledger" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 4.5A1.5 1.5 0 016.5 3H18a2 2 0 012 2v13.5a1.5 1.5 0 01-1.5 1.5H7a2 2 0 01-2-2z"/>
        <path d="M5 17.5A1.5 1.5 0 016.5 16H20"/>
        <path d="M9 7h7"/>
      </symbol>
      <!-- Indicadores (target / kpi) -->
      <symbol id="i-indicadores" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <circle cx="12" cy="12" r="5"/>
        <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
      </symbol>
      <!-- Stats (trending-up) -->
      <symbol id="i-stats" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 17l6-6 4 4 8-8"/>
        <path d="M14 7h7v7"/>
      </symbol>
      <!-- Proyecciones (sparkles / forecast) -->
      <symbol id="i-proyecciones" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8z"/>
        <path d="M18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9z"/>
      </symbol>
      <!-- Recurring (repeat) -->
      <symbol id="i-recurring" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 2.5l3.5 3.5L17 9.5"/>
        <path d="M3.5 11V9a3 3 0 013-3h14"/>
        <path d="M7 21.5L3.5 18 7 14.5"/>
        <path d="M20.5 13v2a3 3 0 01-3 3h-14"/>
      </symbol>
      <!-- Bell -->
      <symbol id="i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8a6 6 0 10-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
        <path d="M10 21h4"/>
      </symbol>
      <!-- Plus (new account) -->
      <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14"/>
      </symbol>
      <!-- Subtypes (tags-stack) -->
      <symbol id="i-subtypes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 8.5V5a2 2 0 012-2h3.5a2 2 0 011.4.6l8.1 8.1a2 2 0 010 2.8l-4 4a2 2 0 01-2.8 0l-8.1-8.1A2 2 0 013 8.5z"/>
        <circle cx="7.5" cy="7.5" r="1.25" fill="currentColor"/>
      </symbol>
      <!-- Tags (single tag) -->
      <symbol id="i-tags" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 10V5a1 1 0 011-1h5l10 10-6 6L4 10z"/>
        <circle cx="8.5" cy="8.5" r="1.25" fill="currentColor"/>
      </symbol>
      <!-- Settings (gear) -->
      <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1.03 1.56V21a2 2 0 01-4 0v-.09A1.7 1.7 0 009 19.4a1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.7 1.7 0 004.6 15a1.7 1.7 0 00-1.56-1.03H3a2 2 0 010-4h.09A1.7 1.7 0 004.6 9a1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06A1.7 1.7 0 009 4.6a1.7 1.7 0 001.03-1.56V3a2 2 0 014 0v.09A1.7 1.7 0 0015 4.6a1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06A1.7 1.7 0 0019.4 9c.36.14.66.4.86.72.2.33.3.7.3 1.08V11a2 2 0 010 4"/>
      </symbol>
      <!-- About (info) -->
      <symbol id="i-about" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 16v-5M12 8h.01"/>
      </symbol>
      <!-- Calendar -->
      <symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.5" y="5" width="17" height="16" rx="2"/>
        <path d="M3.5 10h17M8 3v4M16 3v4"/>
      </symbol>
      <!-- Close -->
      <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6L6 18M6 6l12 12"/>
      </symbol>
    </defs>
  </svg>
</head>

<body class="bg-dark-900 text-dark-300 h-dvh overflow-hidden flex flex-col font-sans">

<!-- ── TOOLBAR ──────────────────────────────────────────────────────────── -->
<header class="h-[56px] bg-dark-800 border-b border-dark-600 flex items-center gap-2
               px-3 shrink-0 z-10">

  <div class="flex items-center gap-2 min-w-0 lg:hidden">
    <span class="text-[22px] shrink-0 text-blue-600" aria-hidden="true"><svg width="24" height="24"><use href="#i-brand"/></svg></span>
    <span id="app-title-mobile" class="font-bold text-dark-100 text-[15px] truncate">Open Accountant</span>
  </div>

  <div class="hidden lg:grid grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)] items-center gap-3 flex-1 min-w-0 overflow-hidden">
    <div class="flex items-center gap-2 min-w-0 justify-self-start max-w-[220px] xl:max-w-none">
      <span class="shrink-0 text-blue-600 inline-flex" aria-hidden="true"><svg width="26" height="26"><use href="#i-brand"/></svg></span>
      <span id="app-title" class="font-bold text-dark-100 text-[15px] tracking-tight truncate">Open Accountant</span>
    </div>

    <nav id="tl-nav" class="toolbar-scroll flex min-w-0 items-center justify-center gap-1 px-2 overflow-x-auto justify-self-center">
      <button class="tbtn nav-icon-btn" data-view="board" data-i18n-title="nav.board" title="Board" aria-label="Board" onclick="View.show('board')">
        <span class="nav-icon" aria-hidden="true"><svg><use href="#i-board"/></svg></span>
        <span class="nav-label" data-i18n="nav.board">Board</span>
      </button>
      <div id="toolbar-board-controls" class="hidden toolbar-board-controls"></div>
      <button class="tbtn nav-icon-btn" data-view="balance" data-i18n-title="nav.balance" title="Balance" aria-label="Balance" onclick="View.show('balance')">
        <span class="nav-icon" aria-hidden="true"><svg><use href="#i-balance"/></svg></span>
        <span class="nav-label" data-i18n="nav.balance">Balance</span>
      </button>
      <button class="tbtn nav-icon-btn" data-view="journal" data-i18n-title="nav.journal" title="Journal" aria-label="Journal" onclick="View.show('journal')">
        <span class="nav-icon" aria-hidden="true"><svg><use href="#i-journal"/></svg></span>
        <span class="nav-label" data-i18n="nav.journal">Journal</span>
      </button>
      <button class="tbtn nav-icon-btn" data-view="ledger" data-i18n-title="nav.ledger" title="Ledger" aria-label="Ledger" onclick="View.show('ledger')">
        <span class="nav-icon" aria-hidden="true"><svg><use href="#i-ledger"/></svg></span>
        <span class="nav-label" data-i18n="nav.ledger">Ledger</span>
      </button>
      <button class="tbtn nav-icon-btn" data-view="indicadores" data-i18n-title="nav.indicadores" title="Indicadores" aria-label="Indicadores" onclick="View.show('indicadores')">
        <span class="nav-icon" aria-hidden="true"><svg><use href="#i-indicadores"/></svg></span>
        <span class="nav-label" data-i18n="nav.indicadores">Indicadores</span>
      </button>
      <button class="tbtn nav-icon-btn" data-view="stats" data-i18n-title="nav.stats" title="Stats" aria-label="Stats" onclick="View.show('stats')">
        <span class="nav-icon" aria-hidden="true"><svg><use href="#i-stats"/></svg></span>
        <span class="nav-label" data-i18n="nav.stats">Stats</span>
      </button>
      <button class="tbtn nav-icon-btn" data-view="proyecciones" data-i18n-title="nav.proyecciones" title="Proyecciones" aria-label="Proyecciones" onclick="View.show('proyecciones')">
        <span class="nav-icon" aria-hidden="true"><svg><use href="#i-proyecciones"/></svg></span>
        <span class="nav-label" data-i18n="nav.proyecciones">Proyecciones</span>
      </button>
      <button class="tbtn nav-icon-btn" data-view="recurring" data-i18n-title="nav.recurring" title="Recurring" aria-label="Recurring" onclick="View.show('recurring')">
        <span class="nav-icon" aria-hidden="true"><svg><use href="#i-recurring"/></svg></span>
        <span class="nav-label" data-i18n="nav.recurring">Recurring</span>
      </button>
      <div class="w-px h-5 bg-dark-600 mx-1 shrink-0"></div>
      <button class="tbtn nav-icon-btn !bg-blue-600 !text-white hover:!bg-blue-500 !border-blue-600"
            title="＋ Account" aria-label="＋ Account"
              data-i18n-title="nav.new_account" onclick="Forms.newAccount()">
        <span class="nav-icon" aria-hidden="true"><svg><use href="#i-plus"/></svg></span>
        <span class="nav-label" data-i18n="nav.new_account">＋ Account</span>
      </button>
      <button class="tbtn nav-icon-btn" data-i18n-title="nav.subtypes" title="Subtypes" aria-label="Subtypes" onclick="View.show('subtypes')">
        <span class="nav-icon" aria-hidden="true"><svg><use href="#i-subtypes"/></svg></span>
        <span class="nav-label" data-i18n="nav.subtypes">Subtypes</span>
      </button>
      <button class="tbtn nav-icon-btn" data-i18n-title="nav.tags" title="Tags" aria-label="Tags" onclick="Forms.tagModal()">
        <span class="nav-icon" aria-hidden="true"><svg><use href="#i-tags"/></svg></span>
        <span class="nav-label" data-i18n="nav.tags">Tags</span>
      </button>
      <div class="w-px h-5 bg-dark-600 mx-1 shrink-0"></div>
      <button class="tbtn nav-icon-btn" data-view="settings" data-i18n-title="nav.settings" title="Settings" aria-label="Settings" onclick="View.show('settings')">
        <span class="nav-icon" aria-hidden="true"><svg><use href="#i-settings"/></svg></span>
        <span class="nav-label" data-i18n="nav.settings">Settings</span>
      </button>
      <button class="tbtn nav-icon-btn" data-view="about" data-i18n-title="nav.about" title="About" aria-label="About" onclick="View.show('about')">
        <span class="nav-icon" aria-hidden="true"><svg><use href="#i-about"/></svg></span>
        <span class="nav-label" data-i18n="nav.about">About</span>
      </button>
    </nav>

    <div class="min-w-0 justify-self-end flex items-center gap-2">
      <button id="recurring-alert"
              type="button"
              class="hidden tbtn text-xs px-2.5 py-1.5 text-amber-300 border-amber-500/40 bg-amber-500/10"
              onclick="RecurringAlert.openActive()">
        <span class="inline-flex align-middle mr-1" aria-hidden="true"><svg width="15" height="15"><use href="#i-bell"/></svg></span>
        <span id="recurring-alert-count">0</span>
      </button>
      <span id="session-user" class="hidden text-xs text-dark-400 whitespace-nowrap"></span>
      <button id="session-logout"
              type="button"
              class="hidden tbtn text-xs px-3 py-1.5"
              onclick="Auth.logout()">Logout</button>
    </div>
  </div>

  <!-- Hamburger (mobile/tablet) -->
  <button id="recurring-alert-mobile"
          type="button"
          class="hidden lg:hidden tbtn text-xs px-2.5 py-1.5 text-amber-300 border-amber-500/40 bg-amber-500/10"
          onclick="RecurringAlert.openActive()">
    <span class="inline-flex align-middle mr-1" aria-hidden="true"><svg width="15" height="15"><use href="#i-bell"/></svg></span>
    <span id="recurring-alert-count-mobile">0</span>
  </button>
  <button id="tl-hamburger" onclick="Nav.toggle()"
          class="lg:hidden ml-auto flex flex-col gap-[5px] p-2 cursor-pointer"
          aria-label="Menu">
    <span class="block w-[22px] h-[2px] bg-dark-400 rounded"></span>
    <span class="block w-[22px] h-[2px] bg-dark-400 rounded"></span>
    <span class="block w-[22px] h-[2px] bg-dark-400 rounded"></span>
  </button>
</header>

<div class="hidden xl:block shrink-0 border-b border-dark-700 bg-dark-900/95 backdrop-blur">
  <div class="toolbar-scroll overflow-x-auto px-3 py-2">
    <div class="flex min-w-max justify-center">
      <div id="tl-filter" class="filter-controls flex min-w-max items-center justify-center gap-1.5 px-3 py-1.5 transition-colors">
  <span class="text-dark-400 shrink-0 inline-flex" aria-hidden="true"><svg width="14" height="14"><use href="#i-calendar"/></svg></span>

  <button onclick="Filter.setToday()"
    class="qfilter-btn tbtn text-[11px] px-2.5 py-1" data-filter-key="filter.today" data-i18n="filter.today">Today</button>
  <button onclick="Filter.setCurrentYear()"
    class="qfilter-btn tbtn text-[11px] px-2.5 py-1" data-filter-key="filter.current_year" data-i18n="filter.current_year">Current year</button>
  <button onclick="Filter.setCurrentMonth()"
    class="qfilter-btn tbtn text-[11px] px-2.5 py-1" data-filter-key="filter.current_month" data-i18n="filter.current_month">Current month</button>
  <button onclick="Filter.setPrevMonth()"
    class="qfilter-btn tbtn text-[11px] px-2.5 py-1" data-filter-key="filter.prev_month" data-i18n="filter.prev_month">Prev. month</button>

  <div class="w-px h-4 bg-dark-600 mx-1 shrink-0"></div>

  <input type="date" id="filter-from" onchange="Filter.apply()"
     class="bg-dark-700 border border-dark-600 rounded-md text-dark-300
        text-[11px] px-2 py-1 cursor-pointer font-sans">
  <span class="text-dark-500 text-[11px]">→</span>
  <input type="date" id="filter-to" onchange="Filter.apply()"
     class="bg-dark-700 border border-dark-600 rounded-md text-dark-300
        text-[11px] px-2 py-1 cursor-pointer font-sans">
  <button onclick="Filter.clear()" data-i18n-title="filter.clear_title" title="Clear filter" aria-label="Clear filter"
      class="text-dark-400 hover:text-dark-300 inline-flex items-center justify-center px-1 shrink-0"><svg width="12" height="12"><use href="#i-close"/></svg></button>
  <div id="toolbar-tag-filter-slot" class="shrink-0 inline-flex items-center"></div>
  <span id="filter-text" class="hidden"></span>
      </div>
    </div>
  </div>
</div>

<!-- ── MOBILE NAV DRAWER ─────────────────────────────────────────────────── -->
<div id="nav-drawer" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden"
     onclick="Nav.close()">
  <aside class="absolute top-0 right-0 h-full w-[min(300px,85vw)] bg-dark-800
                border-l border-dark-600 flex flex-col overflow-y-auto"
         onclick="event.stopPropagation()">

    <div class="flex items-center justify-between p-4 border-b border-dark-600">
      <span id="drawer-app-title" class="font-bold text-dark-100 inline-flex items-center gap-2">
        <span class="text-blue-600 inline-flex" aria-hidden="true"><svg width="20" height="20"><use href="#i-brand"/></svg></span>
        Open Accountant
      </span>
      <button onclick="Nav.close()" class="text-dark-400 hover:text-dark-300 inline-flex items-center justify-center p-1" aria-label="Close"><svg width="18" height="18"><use href="#i-close"/></svg></button>
    </div>

    <nav class="flex flex-col py-2">
      <button class="drawer-btn" onclick="Nav.go('board')"><span class="inline-flex"><svg width="18" height="18"><use href="#i-board"/></svg></span> <span data-i18n='nav.board'>Board</span></button>
      <div id="drawer-board-controls" class="hidden drawer-board-controls"></div>
      <button class="drawer-btn" onclick="Nav.go('balance')"><span class="inline-flex"><svg width="18" height="18"><use href="#i-balance"/></svg></span> <span data-i18n='nav.balance'>Balance</span></button>
      <button class="drawer-btn" onclick="Nav.go('journal')"><span class="inline-flex"><svg width="18" height="18"><use href="#i-journal"/></svg></span> <span data-i18n='nav.journal'>Journal</span></button>
      <button class="drawer-btn" onclick="Nav.go('ledger')"><span class="inline-flex"><svg width="18" height="18"><use href="#i-ledger"/></svg></span> <span data-i18n='nav.ledger'>Ledger</span></button>
      <button class="drawer-btn" onclick="Nav.go('indicadores')"><span class="inline-flex"><svg width="18" height="18"><use href="#i-indicadores"/></svg></span> <span data-i18n='nav.indicadores'>Indicadores</span></button>
      <button class="drawer-btn" onclick="Nav.go('stats')"><span class="inline-flex"><svg width="18" height="18"><use href="#i-stats"/></svg></span> <span data-i18n='nav.stats'>Stats</span></button>
      <button class="drawer-btn" onclick="Nav.go('proyecciones')"><span class="inline-flex"><svg width="18" height="18"><use href="#i-proyecciones"/></svg></span> <span data-i18n='nav.proyecciones'>Proyecciones</span></button>
      <button class="drawer-btn" onclick="Nav.go('recurring')"><span class="inline-flex"><svg width="18" height="18"><use href="#i-recurring"/></svg></span> <span data-i18n='nav.recurring'>Recurring</span></button>
      <hr class="border-dark-600 my-1">
      <button class="drawer-btn font-semibold text-blue-400" onclick="Nav.go('new-account')"><span class="inline-flex"><svg width="18" height="18"><use href="#i-plus"/></svg></span> <span data-i18n='form.new_account'>＋ New Account</span></button>
      <button class="drawer-btn" onclick="Nav.go('subtypes')"><span class="inline-flex"><svg width="18" height="18"><use href="#i-subtypes"/></svg></span> <span data-i18n="nav.subtypes">Subtypes</span></button>
      <button class="drawer-btn" onclick="Nav.go('tags')"><span class="inline-flex"><svg width="18" height="18"><use href="#i-tags"/></svg></span> <span data-i18n="nav.tags">Tags</span></button>
      <hr class="border-dark-600 my-1">
      <button class="drawer-btn" onclick="Nav.go('settings')"><span class="inline-flex"><svg width="18" height="18"><use href="#i-settings"/></svg></span> <span data-i18n='nav.settings'>Settings</span></button>
      <button class="drawer-btn" onclick="Nav.go('about')"><span class="inline-flex"><svg width="18" height="18"><use href="#i-about"/></svg></span> <span data-i18n='nav.about'>About</span></button>
    </nav>
    <div class="border-t border-dark-600 px-4 py-4 flex flex-col gap-2">
      <div id="session-user-mobile" class="hidden text-sm text-dark-300"></div>
      <button id="session-logout-mobile"
              type="button"
              class="hidden w-full px-4 py-2 border border-dark-600 rounded-lg text-dark-300 hover:bg-dark-700 text-sm font-sans cursor-pointer"
              onclick="Auth.logout()">Logout</button>
    </div>
    <!-- Mobile date filter -->
    <div id="mobile-filter-panel" class="filter-controls mt-auto border-t border-dark-600 p-4 transition-colors">
      <p class="text-[11px] text-dark-400 mb-3 inline-flex items-center gap-1.5"><svg width="13" height="13"><use href="#i-calendar"/></svg> Filtro de fechas</p>

      <!-- Quick-filter buttons -->
      <div class="grid grid-cols-4 gap-1.5 mb-3">
        <button onclick="Nav.close();Filter.setToday()"
                class="qfilter-btn text-[11px] px-2 py-2 border border-dark-600 rounded-lg
                       text-dark-400 hover:text-dark-300 hover:bg-dark-700 font-sans cursor-pointer
                 bg-transparent text-center" data-filter-key="filter.today" data-i18n="filter.today">Today</button>
        <button onclick="Nav.close();Filter.setCurrentYear()"
                class="qfilter-btn text-[11px] px-2 py-2 border border-dark-600 rounded-lg
                       text-dark-400 hover:text-dark-300 hover:bg-dark-700 font-sans cursor-pointer
                 bg-transparent text-center" data-filter-key="filter.current_year" data-i18n="filter.current_year">Current year</button>
        <button onclick="Nav.close();Filter.setCurrentMonth()"
                class="qfilter-btn text-[11px] px-2 py-2 border border-dark-600 rounded-lg
                       text-dark-400 hover:text-dark-300 hover:bg-dark-700 font-sans cursor-pointer
                 bg-transparent text-center" data-filter-key="filter.current_month" data-i18n="filter.current_month">Current month</button>
        <button onclick="Nav.close();Filter.setPrevMonth()"
                class="qfilter-btn text-[11px] px-2 py-2 border border-dark-600 rounded-lg
                       text-dark-400 hover:text-dark-300 hover:bg-dark-700 font-sans cursor-pointer
                 bg-transparent text-center" data-filter-key="filter.prev_month" data-i18n="filter.prev_month">Prev. month</button>
      </div>

      <p class="text-[10px] text-dark-500 mb-2" data-i18n="filter.custom_range">Custom range:</p>
      <input type="date" id="filter-from-m" onchange="Filter.applyMobile()"
             class="block w-full bg-dark-700 border border-dark-600 rounded-lg
                    text-dark-300 text-sm px-3 py-2 mb-2 font-sans">
      <input type="date" id="filter-to-m" onchange="Filter.applyMobile()"
             class="block w-full bg-dark-700 border border-dark-600 rounded-lg
                    text-dark-300 text-sm px-3 py-2 mb-2 font-sans">
            <div id="mobile-tag-filter-slot" class="mb-3"></div>
      <button onclick="Filter.clear()"
              class="w-full px-4 py-2 border border-dark-600 rounded-lg text-dark-400
                     hover:text-dark-300 hover:bg-dark-700 text-sm font-sans cursor-pointer inline-flex items-center justify-center gap-2">
        <svg width="12" height="12"><use href="#i-close"/></svg> Limpiar filtro
      </button>
    </div>
  </aside>
</div>

<main id="main" class="flex-1 overflow-hidden flex flex-col min-h-0"></main>

<footer id="status-bar"
        class="shrink-0 h-[34px] bg-dark-800 border-t border-dark-600 px-3
               hidden md:flex items-center justify-between gap-3 text-[11px] text-dark-400 overflow-hidden">

  <div id="status-datetime" class="shrink-0 text-dark-300"></div>
</footer>

<!-- ── FAB (JS controla display via inline style) ─────────────── -->
<button id="fab" onclick="Forms.newTransactionFAB()"
        class="fab fixed bottom-6 right-5 w-14 h-14 rounded-full bg-blue-600
               text-white text-3xl font-light shadow-lg
               hover:bg-blue-500 active:scale-95 transition-all z-20
               items-center justify-center"
        aria-label="New transaction"
        style="display:none">＋</button>

<!-- ── FX LIGHTNING CANVAS ──────────────────────────────────────────────── -->
<canvas id="fx-lightning-canvas" aria-hidden="true"></canvas>

<!-- ── DRAG GHOST ───────────────────────────────────────────────────────── -->
<div id="ghost" class="ghost hidden"></div>

<!-- ── LOGIN GATE ────────────────────────────────────────────────────────── -->
<div id="auth-overlay"
     class="fixed inset-0 z-[1100] px-4 py-6 flex items-center justify-center">
  <div class="w-full max-w-md rounded-3xl border border-dark-600 bg-dark-800/95 shadow-2xl backdrop-blur p-6 sm:p-8">
    <div class="text-center mb-8">
      <div class="text-blue-600 inline-flex mb-4" aria-hidden="true"><svg width="48" height="48"><use href="#i-brand"/></svg></div>
      <h1 id="auth-app-title" class="text-3xl font-extrabold text-dark-100 tracking-tight">Open Accountant</h1>
      <p class="text-sm text-dark-400 mt-3">Sign in to access your shared household ledger.</p>
    </div>

    <form id="auth-form" class="space-y-4">
      <label class="flex flex-col gap-1.5">
        <span class="text-[11px] uppercase tracking-[.08em] text-dark-400 font-semibold">Username</span>
        <input id="auth-username"
               type="text"
               autocomplete="username"
               class="bg-dark-700 border border-dark-600 rounded-xl text-dark-200 text-sm px-4 py-3 font-sans outline-none focus:border-blue-500"
               required>
      </label>

      <label class="flex flex-col gap-1.5">
        <span class="text-[11px] uppercase tracking-[.08em] text-dark-400 font-semibold">Password</span>
        <input id="auth-password"
               type="password"
               autocomplete="current-password"
               class="bg-dark-700 border border-dark-600 rounded-xl text-dark-200 text-sm px-4 py-3 font-sans outline-none focus:border-blue-500"
               required>
      </label>

      <label class="flex items-center gap-3 cursor-pointer select-none text-sm text-dark-300 pt-1">
        <input id="auth-remember"
               type="checkbox"
               class="w-4 h-4 accent-blue-500">
        <span>Remember me for 30 days on this device</span>
      </label>

      <div id="auth-error" class="hidden rounded-xl border border-pasivo/30 bg-red-950/20 px-4 py-3 text-sm text-pasivo"></div>

      <button id="auth-submit"
              type="submit"
              class="w-full rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 transition-colors">Sign in</button>
    </form>
  </div>
</div>

<!-- ── MODAL ────────────────────────────────────────────────────────────── -->
<div id="modal-overlay"
     class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[1000] hidden
       flex items-center sm:items-center items-end">
  <div id="modal-box"
       class="modal-box bg-dark-800 border border-dark-600 rounded-2xl
              w-full max-w-lg mx-4 sm:mx-auto max-h-[92dvh] overflow-y-auto
    shadow-2xl"
  role="dialog"
  aria-modal="true">
    <div id="modal-content"></div>
  </div>
</div>
