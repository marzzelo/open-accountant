name: Release Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare zip asset
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=open-accountant-${GITHUB_REF_NAME}/ --output=dist/open-accountant-${GITHUB_REF_NAME}.zip HEAD

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          asset="dist/open-accountant-${GITHUB_REF_NAME}.zip"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --generate-notes
          fi
