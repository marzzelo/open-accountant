name: Release Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare zip asset
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=open-accountant-${GITHUB_REF_NAME}/ --output=dist/open-accountant-${GITHUB_REF_NAME}.zip HEAD

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/open-accountant-${{ github.ref_name }}.zip
          generate_release_notes: true