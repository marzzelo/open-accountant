name: Bug report
description: Report a reproducible problem in Open Accountant.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        Please do not use this form for security vulnerabilities. Use the private process in SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Project version
      description: Which release, branch, or commit are you using?
      placeholder: v1.0.0 or main
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, Ubuntu 24.04, macOS 15
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: 3.10.14
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Please list exact steps.
      placeholder: |
        1. Open Settings
        2. Create a new book
        3. Import a backup
        4. Observe the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or sample payloads
      description: Remove personal accounting data before sharing.